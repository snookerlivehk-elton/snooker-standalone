version: "3.9"
services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      SOCKET_IO_PATH: ${SOCKET_IO_PATH:-/socket.io}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/env-history.jsonl:/app/env-history.jsonl
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_SOCKET_URL: ${VITE_SOCKET_URL}
      VITE_SOCKET_PATH: ${VITE_SOCKET_PATH:-/socket.io}
    ports:
      - "5173:5173"
    depends_on:
      - backend
  proxy:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx/cloud.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
