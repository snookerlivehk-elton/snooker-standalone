version: "3.9"
services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/env-history.jsonl:/app/env-history.jsonl
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend
  proxy:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx/cloud.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
