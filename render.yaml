# Databases section removed to avoid free-tier limit; reuse existing DB via env var

services:
  - type: web
    name: snooker-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:migrate
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin Node runtime to v20 to avoid EBADENGINE/cache mismatches
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      # Comma-separated origins for CORS; set in dashboard for your domains
      - key: CORS_ORIGIN
        value: "https://ballstream-frontend.onrender.com"
      # Admin token to protect /admin endpoints; set securely in dashboard
      - key: ADMIN_TOKEN
        sync: false
      # Optional write token for match write endpoints
      - key: WRITE_TOKEN
        sync: false
      # Socket.io path (defaults to /socket.io)
      - key: SOCKET_IO_PATH
        value: "/socket.io"

  # Frontend static site (Vite React)
  - type: web
    name: snooker-frontend
    rootDir: frontend
    runtime: static
    # No paid plan; static runtime stays free
    buildCommand: VITE_SOCKET_URL="https://${BACKEND_HOST}.onrender.com" VITE_API_URL="https://${BACKEND_HOST}.onrender.com" VITE_SOCKET_PATH="/socket.io" node ../scripts/generate-admin-redirect.js && npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: snooker-backend
          type: web
          property: host
